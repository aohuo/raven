<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{$title}</title>
<link href="https://cdn.bootcss.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/main.css">
    <link rel="stylesheet" href="/static/hui.css">


    <style type="text/css">
      [v-cloak]{
        display: none;
      }
    </style>
  </head>

  <body>
    <body class="hui-background-color-white">
    <div class="row" style="height: 20px"></div>
<div>
  <img src="../../../../public/img/1ST.jpg" alt="格斗数据管理网站" width="60%" height="60%" class="center-block">
</div> 

<div class="row" style="height: 20px"></div>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12"> 
      </div>
    </div>
   
    <div class="row">
      <div class="col-md-4"></div>
      <div class="col-md-4 hui-margin-top-30 hui-padding-all-20 hui-background-color-white">  
         <form role="form" action="{:url('login_check')}" method="post">
          <div class="form-group">
            <label for="zh">用户名：</label>
            <input type="text" name="work" class="form-control" id="zh" placeholder="账号">
          </div>
          <div class="form-group">
            <label for="mm">密码</label>
            <input type="password" name="password" class="form-control" id="mm" placeholder="密码">
          </div>
          
              <button type="submit" class="btn btn-primary btn-block">登录</button>
    
        </form>

        <form role="form" action="{:url('register')}" method="post">
          <div class="col-md-4"></div>
          <div class="hui-width-full hui-padding-all-30">             
           <button type="submit" class="btn btn-default btn-block">注册</button>
          </div>
       </form>
       


      </div>
      <div class="col-md-4"></div>
    </div>
  </div>

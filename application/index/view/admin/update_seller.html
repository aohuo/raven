{include file="common/header" title="$title" /}

          <form role="form" action="{:url('update_seller_check')}" method="post">
            <div class="form-group">
              <label for="mm">店铺信息：</label>
              <select class="form-control" name="call">
                {volist name="seller" id="vo"}
                  <option value='{$vo.call}'>{$vo.call}.{$vo.sname}</option>
                {/volist}
              </select>
            </div>
            <div class="form-group">
            <label for="mm">所属地区：</label>
            <select class="form-control" name="saddress">
                <option value='贝洛伯格'>贝洛伯格</option>
                <option value='黑塔空间站'>黑塔空间站</option>
                <option value='罗浮仙州'>罗浮仙州</option>
              </select>

            <button type="submit" class="btn btn-primary btn-block">提交</button>
          </form>

  {include file="common/footer" /}

{include file="common/header" title="$title" /}
      <form role="form" action="{:url('search_customer_view')}" method="post">
          <div class="form-group">
            <label for="mm">订单编号：</label>
            <select class="form-control" name="cno">
              {volist name="customer" id="vo"}
                <option value='{$vo.cno}'>{$vo.cno}.{$vo.name}</option>
              {/volist}>
              </select>
          </div>

          <button type="submit" class="btn btn-primary btn-block">提交</button>
        </form>
  {include file="common/footer" /}
